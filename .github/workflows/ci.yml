name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  format-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/release.py validate
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          targets: wasm32-wasip2
      - name: Build WASM with the registry toolchain and output layout
        working-directory: extension
        run: |
          cargo build --target wasm32-wasip2 --release --locked --target-dir target
          test -s target/wasm32-wasip2/release/zed_console_log_extension.wasm

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - run: cargo check --workspace --locked
